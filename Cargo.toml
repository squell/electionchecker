[package]
name = "kiesraad-model"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.9.0"
csv = { version = "1.3.1", optional = true }
clap = { version = "4.5", features = ["derive"] }

[features]
default = ["rand-validate", "loop-validate", "whole-seat-opt", "nice-frac"]
validate = ["dep:csv"]
rand-validate = ["validate"]
loop-validate = ["validate"]
nice-frac = []
chatty = []
whole-seat-opt = []
undocumented = ["whole-seat-opt"]
